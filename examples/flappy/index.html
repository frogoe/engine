<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flappy Chick</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #4ec0ca;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #c {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* HUD layer + placement (frogoe-core → hud-bindings) */
      .hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .hud > * {
        position: absolute;
      }
      .hud [data-pos="top-center"] {
        top: calc(env(safe-area-inset-top) + 14px);
        left: 50%;
        translate: -50% 0;
      }

      /* theme ALL blocks from the BRIEF palette — one parent rule */
      .hud {
        --block-accent: #f8b733;
        --block-fg: #fafafa;
        --block-outline: #543847;
        --block-font: "Fredoka", system-ui, sans-serif;
      }

      /* ===== registry block: hud-score-card (copied, themed above) ===== */
      .block-score-card {
        --block-size: clamp(3rem, 12vmin, 4.5rem);
        color: var(--block-fg);
        font-family: var(--block-font);
        font-size: var(--block-size);
        font-weight: 700;
        line-height: 1;
        text-align: center;
        pointer-events: none;
      }
      .block-score-card__label {
        display: block;
        font-size: 0.32em;
        font-weight: 600;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        opacity: 0.85;
        text-shadow: 0 2px 0 var(--block-outline);
      }
      .block-score-card__value {
        display: block;
        font-variant-numeric: tabular-nums;
        text-shadow:
          0 0.09em 0 var(--block-outline),
          0 0.16em 0.24em rgba(0, 0, 0, 0.35);
      }
      .block-score-card__value[data-bump] {
        animation: hud-score-bump 240ms cubic-bezier(0.34, 1.8, 0.5, 1);
      }
      @keyframes hud-score-bump {
        from {
          transform: scale(1.28);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .block-score-card__value[data-bump] {
          animation: none;
        }
      }

      /* ===== registry block: hud-game-over-card (copied, themed above) ===== */
      .block-game-over {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(10, 6, 16, 0.55);
        font-family: var(--block-font);
        color: var(--block-fg);
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
      }
      .block-game-over[data-open] {
        opacity: 1;
        pointer-events: auto;
      }
      .block-game-over__card {
        display: grid;
        justify-items: center;
        gap: 0.35em;
        min-width: min(78vw, 20rem);
        padding: 2rem 2.4rem 2.2rem;
        background: #2b4a50;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.6rem;
        box-shadow: 0 1.2rem 3rem rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      .block-game-over[data-open] .block-game-over__card {
        animation: hud-card-in 320ms cubic-bezier(0.34, 1.56, 0.5, 1);
      }
      @keyframes hud-card-in {
        from {
          transform: translateY(1.2rem) scale(0.92);
          opacity: 0;
        }
      }
      .block-game-over__title {
        font-size: clamp(1.6rem, 7vmin, 2.4rem);
        font-weight: 700;
        text-shadow: 0 3px 0 var(--block-outline);
      }
      .block-game-over__subtitle {
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        opacity: 0.6;
        text-shadow: 0 2px 0 var(--block-outline);
      }
      .block-game-over[data-new-best] .block-game-over__subtitle {
        color: var(--block-accent);
        opacity: 1;
        animation: hud-best-pulse 800ms ease-in-out infinite alternate;
      }
      @keyframes hud-best-pulse {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.55;
        }
      }
      .block-game-over__score {
        font-size: clamp(2.6rem, 12vmin, 4rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 4px 0 var(--block-outline);
      }
      .block-game-over__best {
        font-size: 0.95rem;
        font-weight: 600;
        opacity: 0.75;
        text-shadow: 0 2px 0 var(--block-outline);
      }
      .block-game-over__retry {
        margin-top: 0.9em;
        font-family: inherit;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #2b4a50;
        background: var(--block-accent);
        border: none;
        border-radius: 999px;
        padding: 0.85em 2.6em;
        cursor: pointer;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35);
        transition:
          transform 80ms ease,
          box-shadow 80ms ease;
      }
      .block-game-over__retry:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      @media (prefers-reduced-motion: reduce) {
        .block-game-over[data-open] .block-game-over__card {
          animation: none;
        }
        .block-game-over[data-new-best] .block-game-over__subtitle {
          animation: none;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "frogoe": "./.frogoe/contract.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="hud">
      <div class="block-score-card" data-pos="top-center">
        <span class="block-score-card__label">Score</span>
        <span class="block-score-card__value" data-block-score>0</span>
      </div>
      <div class="block-game-over" data-block-gameover>
        <div class="block-game-over__card">
          <span class="block-game-over__title">Flame Out</span>
          <span class="block-game-over__subtitle" data-block-subtitle>Score</span>
          <span class="block-game-over__score" data-block-final>0</span>
          <span class="block-game-over__best">Best <b data-block-best>0</b></span>
          <button class="block-game-over__retry" type="button" data-block-retry>Retry</button>
        </div>
      </div>
    </div>
    <script type="module" src="game.js"></script>
  </body>
</html>
