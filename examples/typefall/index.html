<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Typefall</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none;
      background: var(--game-bg, #101418);
      /* phones are the primary device: no long-press selection, no callout */
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #c { display: block; width: 100vw; height: 100vh; }

    /* HUD layer + safe-area-aware placement (frogoe-core → hud-bindings) */
    .hud { position: absolute; inset: 0; pointer-events: none; }
    .hud > * { position: absolute; }
    .hud [data-pos="top-left"]      { top: calc(env(safe-area-inset-top) + 12px); left: calc(env(safe-area-inset-left) + 12px); }
    .hud [data-pos="top-center"]    { top: calc(env(safe-area-inset-top) + 12px); left: 50%; translate: -50% 0; }
    .hud [data-pos="top-right"]     { top: calc(env(safe-area-inset-top) + 12px); right: calc(env(safe-area-inset-right) + 12px); }
    .hud [data-pos="bottom-left"]   { bottom: calc(env(safe-area-inset-bottom) + 12px); left: calc(env(safe-area-inset-left) + 12px); }
    .hud [data-pos="bottom-center"] { bottom: calc(env(safe-area-inset-bottom) + 12px); left: 50%; translate: -50% 0; }

    /* theme every block from the BRIEF palette — one parent rule */
    .hud {
      --block-accent: #28e0e8;
      --block-fg: #f5f2ff;
      --block-outline: #03040e;
      --block-heart: #ff4d6d;
      --block-heart-empty: #3a2434;
      --block-font: "Space Grotesk", system-ui, sans-serif;
      --block-mono: "Space Mono", ui-monospace, monospace;
      --block-body: "Plus Jakarta Sans", system-ui, sans-serif;
    }
  
    /* ===== score-card (frogoe add) ===== */
    .block-score-card {
        /* theme — override these */
        --block-accent: #ffd166;
        --block-fg: #fffdf7;
        --block-font: "Space Grotesk", system-ui, sans-serif;
        --block-outline: #26180a;
        --block-size: clamp(2.4rem, 9vmin, 3.6rem);

        color: var(--block-fg);
        font-family: var(--block-font);
        font-size: var(--block-size);
        font-weight: 700;
        line-height: 1;
        text-align: center;
        -webkit-user-select: none;
        user-select: none;
        pointer-events: none;
      }
      .block-score-card__label {
        display: block;
        font-size: 0.32em;
        font-weight: 600;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        opacity: 0.85;
      }
      .block-score-card__value {
        display: block;
        font-variant-numeric: tabular-nums;
        /* sticker depth: hard offset shadow, no blur */
        text-shadow:
          0 0.09em 0 var(--block-outline),
          0 0.16em 0.24em rgba(0, 0, 0, 0.35);
      }
      .block-score-card__value[data-bump] {
        /* score changed this frame — game toggles the attribute to fire the pop */
        animation: block-score-bump 240ms cubic-bezier(0.34, 1.8, 0.5, 1);
      }
      @keyframes block-score-bump {
        from {
          transform: scale(1.28);
        }
        to {
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .block-score-card__value[data-bump] {
          animation: none;
        }
      }
  
    /* ===== hearts-row (frogoe add) ===== */
    .block-hearts-row {
        --block-gap: 0.5em;
        --block-heart: #ff4d6d;
        --block-heart-empty: rgba(255, 255, 255, 0.18);
        --block-outline: #33101d;
        --block-size: clamp(1.4rem, 5vmin, 2rem);

        display: flex;
        gap: var(--block-gap);
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .block-hearts-row__heart {
        width: var(--block-size);
        height: var(--block-size);
        background: var(--block-heart);
        /* heart silhouette — no icon font, no image */
        -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>")
          center / contain no-repeat;
        mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>")
          center / contain no-repeat;
        filter: drop-shadow(0 2px 0 var(--block-outline)) drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }
      .block-hearts-row__heart[aria-hidden="true"] {
        background: var(--block-heart-empty);
        filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.25));
        transform: scale(0.86);
        animation: block-heart-pop 320ms cubic-bezier(0.34, 1.8, 0.5, 1);
      }
      @keyframes block-heart-pop {
        from {
          transform: scale(1.35) rotate(-8deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .block-hearts-row__heart,
        .block-hearts-row__heart[aria-hidden="true"] {
          animation: none;
          transition: none;
        }
      }
  
    /* ===== combo-counter (frogoe add) ===== */
    .block-combo {
        --block-accent: #ffd166;
        --block-fg: #fffdf7;
        --block-font: "Space Grotesk", system-ui, sans-serif;
        --block-outline: #26180a;

        display: grid;
        justify-items: center;
        line-height: 1;
        color: var(--block-fg);
        font-family: var(--block-font);
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .block-combo__label {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        text-indent: 0.4em; /* optical center against tracking */
        opacity: 0.75;
      }
      .block-combo__value {
        font-size: clamp(2rem, 9vmin, 3.2rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 3px 0 var(--block-outline);
      }
      .block-combo__value[data-pop] {
        animation: block-combo-pop 240ms cubic-bezier(0.34, 1.8, 0.5, 1);
      }
      @keyframes block-combo-pop {
        from {
          transform: scale(1.32) rotate(-2deg);
        }
      }
      /* escalation tiers — derived from the single accent, saturation climbs */
      .block-combo[data-tier="1"] {
        --block-fg: color-mix(in srgb, var(--block-accent) 45%, #fffdf7);
      }
      .block-combo[data-tier="2"] {
        --block-fg: var(--block-accent);
      }
      .block-combo[data-tier="3"] {
        --block-fg: color-mix(in srgb, var(--block-accent) 70%, #ff5d5d);
        animation: block-combo-hot 600ms ease-in-out infinite alternate;
      }
      @keyframes block-combo-hot {
        from {
          scale: 1;
        }
        to {
          scale: 1.06;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .block-combo__value[data-pop],
        .block-combo[data-tier="3"] {
          animation: none;
        }
      }
  
    /* ===== ready-gate (frogoe add) ===== */
    .block-ready-gate {
        --block-accent: #ffd166;
        --block-cta: #ffd166;
        --block-cta-label: #26180a;
        --block-cta-shadow: #a8842c;
        --block-fg: #fffdf7;
        --block-font: "Space Grotesk", system-ui, sans-serif;
        --block-gate-bg: rgba(10, 12, 16, 0.66);
        --block-outline: #26180a;

        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--block-gate-bg);
        backdrop-filter: blur(8px);
        color: var(--block-fg);
        font-family: var(--block-font);
        cursor: pointer;
        transition: opacity 260ms ease;
        -webkit-user-select: none;
        user-select: none;
      }
      .block-ready-gate[data-hidden] {
        opacity: 0;
        pointer-events: none;
      }
      .block-ready-gate__inner {
        display: grid;
        justify-items: center;
        padding: 1rem 2rem;
        text-align: center;
      }
      .block-ready-gate__title {
        font-size: clamp(1.8rem, 8vmin, 2.8rem);
        font-weight: 700;
        letter-spacing: 0.03em;
        text-shadow: 0 3px 0 var(--block-outline);
      }
      .block-ready-gate__cta {
        margin-top: 0.9em;
        font-family: inherit;
        font-size: clamp(0.95rem, 3.4vmin, 1.2rem);
        font-weight: 700;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        text-transform: uppercase;
        color: var(--block-cta-label);
        background: var(--block-cta);
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
        border: none;
        border-radius: 999px;
        padding: 0.8em 2.4em;
        box-shadow: 0 5px 0 var(--block-cta-shadow);
        animation: block-gate-breathe 1.4s ease-in-out infinite alternate;
      }
      @keyframes block-gate-breathe {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-6px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .block-ready-gate__cta {
          animation: none;
        }
        .block-ready-gate {
          transition: none;
        }
      }
  
    /* ===== game-over-card (frogoe add) ===== */
    .block-game-over {
        --block-accent: #ffd166;
        --block-card: #171d2e;
        --block-cta: #ffcf3f;
        --block-cta-label: #241a06;
        --block-font: "Space Grotesk", system-ui, sans-serif;
        --block-outline: #0a0e1a;

        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(4, 6, 12, 0.55);
        font-family: var(--block-font);
        color: #fffdf7;
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
        -webkit-user-select: none;
        user-select: none;
      }
      .block-game-over[data-open] {
        opacity: 1;
        pointer-events: auto;
      }
      .block-game-over__card {
        display: grid;
        justify-items: center;
        gap: 0.35em;
        min-width: min(78vw, 20rem);
        padding: 2rem 2.4rem 2.2rem;
        background: var(--block-card);
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.6rem;
        box-shadow: 0 1.2rem 3rem rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      .block-game-over[data-open] .block-game-over__card {
        animation: block-card-in 320ms cubic-bezier(0.34, 1.56, 0.5, 1);
      }
      @keyframes block-card-in {
        from {
          transform: translateY(1.2rem) scale(0.92);
          opacity: 0;
        }
      }
      .block-game-over__title {
        font-size: clamp(1.6rem, 7vmin, 2.4rem);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-shadow: 0 3px 0 var(--block-outline);
      }
      .block-game-over__subtitle {
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        opacity: 0.6;
      }
      .block-game-over[data-new-best] .block-game-over__subtitle {
        color: var(--block-accent);
        opacity: 1;
        animation: block-best-pulse 800ms ease-in-out infinite alternate;
      }
      @keyframes block-best-pulse {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.55;
        }
      }
      .block-game-over__score {
        font-size: clamp(2.6rem, 12vmin, 4rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
        text-shadow: 0 4px 0 var(--block-outline);
      }
      .block-game-over__best {
        font-size: 0.95rem;
        font-weight: 600;
        opacity: 0.75;
      }
      .block-game-over__retry {
        margin-top: 0.9em;
        font-family: inherit;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--block-cta-label);
        background: var(--block-cta);
        border: none;
        border-radius: 999px;
        padding: 0.85em 2.6em;
        cursor: pointer;
        /* chunky button: hard extrusion under, push-in on press */
        box-shadow: 0 5px 0 color-mix(in srgb, var(--block-cta) 62%, black);
        transition:
          transform 80ms ease,
          box-shadow 80ms ease;
      }
      .block-game-over__retry:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 color-mix(in srgb, var(--block-cta) 62%, black);
      }
      @media (prefers-reduced-motion: reduce) {
        .block-game-over[data-open] .block-game-over__card {
          animation: none;
        }
        .block-game-over[data-new-best] .block-game-over__subtitle {
          animation: none;
        }
        .block-game-over {
          transition: none;
        }
      }
  
    /* ===== hud-keyboard (frogoe add) ===== */
    .block-hud-keyboard {
        /* theme — override these */
        --block-key-ink: #f5f2ff;
        --block-key-ink-dim: #6c6890;
        --block-key-core: #0e0c18;
        --block-key-tray: rgba(7, 6, 12, 0.95);
        --block-key-hairline: rgba(255, 255, 255, 0.08);
        --block-key-press: #ff6a3d;
        --block-key-press-tint: rgba(255, 106, 61, 0.12);
        --block-key-press-line: rgba(255, 106, 61, 0.5);
        --block-key-font: "Space Mono", ui-monospace, monospace;

        background: var(--block-key-tray);
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        bottom: 0;
        display: none;
        left: 0;
        padding: 10px 8px calc(env(safe-area-inset-bottom) + 8px);
        position: absolute;
        right: 0;
        /* the tray is field furniture, not a floating card */
        pointer-events: auto;
      }
      /* touch devices: the keyboard is an input surface; precise pointers
         (desktop) have hardware keys — the tray never shows there */
      @media (pointer: coarse) {
        .block-hud-keyboard[data-open] {
          display: block;
        }
      }
      .block-hud-keyboard__row {
        display: flex;
        gap: 6px;
        justify-content: center;
      }
      .block-hud-keyboard__row + .block-hud-keyboard__row {
        margin-top: 6px;
      }
      .block-hud-keyboard__row--offset-a {
        padding-left: 20px;
      }
      .block-hud-keyboard__row--offset-z {
        padding-left: 34px;
      }
      .block-hud-keyboard__key {
        -webkit-appearance: none;
        appearance: none;
        /* double-bezel: dark core + hairline shell */
        background: var(--block-key-core);
        border: 1px solid var(--block-key-hairline);
        border-radius: 8px;
        color: var(--block-key-ink);
        cursor: pointer;
        font-family: var(--block-key-font);
        font-size: clamp(0.9rem, 4.2vmin, 1.15rem);
        font-weight: 700;
        height: clamp(42px, 8vmin, 52px);
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
        transition: transform 80ms cubic-bezier(0.32, 0.72, 0, 1), background 80ms,
          border-color 80ms, box-shadow 80ms;
        width: clamp(28px, 8.4vw, 34px);
      }
      .block-hud-keyboard__key[data-pressed],
      .block-hud-keyboard__key:active {
        background: var(--block-key-press-tint);
        border-color: var(--block-key-press-line);
        box-shadow: 0 0 8px var(--block-key-press-tint);
        color: var(--block-key-press);
        transform: scale(0.92);
      }
      .block-hud-keyboard__key--wide {
        font-size: clamp(0.8rem, 3.4vmin, 1rem);
        width: auto;
        min-width: clamp(48px, 14vw, 60px);
      }
      @media (prefers-reduced-motion: reduce) {
        .block-hud-keyboard__key,
        .block-hud-keyboard__key[data-pressed],
        .block-hud-keyboard__key:active {
          transition: none;
          transform: none;
        }
      }

                <button class="block-hud-keyboard__key" data-block-key data-key="-" data-code="Minus" data-disabled type="button">-</button>
                <button class="block-hud-keyboard__key" data-block-key data-key="/" data-code="Slash" data-disabled type="button">/</button>
                <button class="block-hud-keyboard__key" data-block-key data-key=":" data-code="Semicolon" data-shift="1" data-disabled type="button">:</button>
                <button class="block-hud-keyboard__key" data-block-key data-key=";" data-code="Semicolon" data-disabled type="button">;</button>
                <button class="block-hud-keyboard__key" data-block-key data-key="(" data-code="Digit9" data-shift="1" data-disabled type="button">(</button>
                <button class="block-hud-keyboard__key" data-block-key data-key=")" data-code="Digit0" data-shift="1" data-disabled type="button">)</button>
                <button class="block-hud-keyboard__key" data-block-key data-key="$" data-code="Digit4" data-shift="1" data-disabled type="button">$</button>
                <button class="block-hud-keyboard__key" data-block-key data-key="&amp;" data-code="Digit7" data-shift="1" data-disabled type="button">&amp;</button>
                <button class="block-hud-keyboard__key" data-block-key data-key="@" data-code="Digit2" data-shift="1" data-disabled type="button">@</button>
                <button class="block-hud-keyboard__key" data-block-key data-key='"' data-code="Quote" data-shift="1" data-disabled type="button">"</button><div class="block-hud-keyboard__spacer"></div></div>
              <div class="block-hud-keyboard__row" data-layer="numbers"><div class="block-hud-keyboard__spacer--wide block-hud-keyboard__spacer"></div>
                <button class="block-hud-keyboard__key" data-block-key data-key="." data-code="Period" data-disabled type="button">.</button>
                <button class="block-hud-keyboard__key" data-block-key data-key="," data-code="Comma" data-disabled type="button">,</button>
                <button class="block-hud-keyboard__key" data-block-key data-key="?" data-code="Slash" data-shift="1" data-disabled type="button">?</button>
                <button class="block-hud-keyboard__key" data-block-key data-key="!" data-code="Digit1" data-shift="1" data-disabled type="button">!</button>
                <button class="block-hud-keyboard__key" data-block-key data-key="'" data-code="Quote" data-disabled type="button">'</button>
                <button class="block-hud-keyboard__key block-hud-keyboard__key--wide" data-block-key data-key="Backspace" data-code="Backspace" data-disabled type="button">⌫</button>
              </div>
              <div class="block-hud-keyboard__row" data-layer="numbers">
                <button class="block-hud-keyboard__key block-hud-keyboard__key--wide block-hud-keyboard__key--special" data-block-layer="letters" type="button">ABC</button>
                <button class="block-hud-keyboard__key block-hud-keyboard__key--space" data-block-key data-key=" " data-code="Space" data-disabled data-disabled data-disabled type="button">space</button>
                <button class="block-hud-keyboard__key block-hud-keyboard__key--wide block-hud-keyboard__key--special" data-block-key data-key="Enter" data-code="Enter" data-disabled data-disabled data-disabled type="button">return</button>
              </div>
            </div>
        
            <script>
              // Self-contained dispatch: presses emit REAL KeyboardEvents on
              // window, so the frogoe contract (input.on("key"), input.keys)
              // receives them exactly like hardware keys. One edge per press —
              // held state is the reader's business (poll input.keys).
              (() => {
                const board = document.querySelector(".block-hud-keyboard");
                if (!board || board.dataset.frogoeBound) return;
                board.dataset.frogoeBound = "1";
                const held = new Map(); // pointerId → button
                let shift = "off"; // off | on (one shot) | lock (double tap)
                let lastShiftTap = 0;
                const emitRaw = (dir, key, code, shiftKey) => {
                  window.dispatchEvent(
                    new KeyboardEvent(dir === "down" ? "keydown" : "keyup", {
                      bubbles: true,
                      cancelable: true,
                      code,
                      key,
                      shiftKey: shiftKey === true,
                    }),
                  );
                };
                const emit = (button, dir) => {
                  const key = button.dataset.key ?? "";
                  const code = button.dataset.code ?? "";
                  const shifted = button.dataset.shift === "1" || (shift !== "off" && key.length === 1);
                  const outKey = shifted && key.length === 1 ? key.toUpperCase() : key;
                  emitRaw(dir, outKey, code, shifted);
                  if (dir === "down" && shift === "on") setShift("off"); // one shot spent
                };
                const setShift = (state) => {
                  shift = state;
                  const el = board.querySelector("[data-block-shift]");
                  if (!el) return;
                  el.removeAttribute("data-state");
                  if (state !== "off") el.setAttribute("data-state", state);
                };
                const shiftButton = board.querySelector("[data-block-shift]");
                shiftButton?.addEventListener("pointerdown", (e) => {
                  e.preventDefault();
                  e.stopPropagation(); // a modifier press, not a text key
                  const t = performance.now();
                  if (shift === "off") setShift("on");
                  else if (shift === "on") setShift(t - lastShiftTap < 320 ? "lock" : "off");
                  else setShift("off");
                  lastShiftTap = t;
                  emitRaw("down", "Shift", "ShiftLeft", true);
                });
                shiftButton?.addEventListener("pointerup", () => emitRaw("up", "Shift", "ShiftLeft", true));
                for (const toggle of board.querySelectorAll("[data-block-layer]")) {
                  toggle.addEventListener("pointerdown", (e) => {
                    e.preventDefault();
                    board.dataset.mode = toggle.dataset.blockLayer === "numbers" ? "numbers" : "letters";
                  });
                }
                const press = (button, id) => {
                  if (held.has(id)) return; // one key per pointer
                  held.set(id, button);
                  button.toggleAttribute("data-pressed", true);
                  emit(button, "down");
                };
                const release = (id) => {
                  const button = held.get(id);
                  if (!button) return;
                  held.delete(id);
                  button.toggleAttribute("data-pressed", false);
                  emit(button, "up");
                };
                board.addEventListener("pointerdown", (e) => {
                  const button = e.target.closest?.("button[data-key]");
                  if (!button || button.hasAttribute("data-disabled")) return;
                  e.preventDefault();
                  press(button, e.pointerId);
                });
                board.addEventListener("contextmenu", (e) => e.preventDefault());
                window.addEventListener("pointerup", (e) => release(e.pointerId));
                window.addEventListener("pointercancel", (e) => release(e.pointerId));
                window.addEventListener("blur", () => {
                  for (const id of [...held.keys()]) release(id);
                });
              })();
            </script>
      <!-- frogoe:block:hud-keyboard --></div>
            </div>
      <!-- frogoe:block:game-over-card -->
      </div>
  <script type="module" src="game.js"></script>
</body>
