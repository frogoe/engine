  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none;
      background: var(--game-bg, #101418);
      /* phones are the primary device: no long-press selection, no callout */
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #c { display: block; width: 100vw; height: 100vh; }

    /* HUD layer + safe-area-aware placement (frogoe-core → hud-bindings) */
    .hud { position: absolute; inset: 0; pointer-events: none; }
    .hud > * { position: absolute; }
    .hud [data-pos="top-left"]      { top: calc(env(safe-area-inset-top) + 12px); left: calc(env(safe-area-inset-left) + 12px); }
    .hud [data-pos="top-center"]    { top: calc(env(safe-area-inset-top) + 12px); left: 50%; translate: -50% 0; }
    .hud [data-pos="top-right"]     { top: calc(env(safe-area-inset-top) + 12px); right: calc(env(safe-area-inset-right) + 12px); }
    .hud [data-pos="bottom-left"]   { bottom: calc(env(safe-area-inset-bottom) + 12px); left: calc(env(safe-area-inset-left) + 12px); }
    .hud [data-pos="bottom-center"] { bottom: calc(env(safe-area-inset-bottom) + 12px); left: 50%; translate: -50% 0; }

    /* theme every block from the BRIEF palette — one parent rule */
    .hud {
      --block-accent: #28e0e8;
      --block-fg: #f5f2ff;
      --block-outline: #03040e;
      --block-font: "Baloo 2", system-ui, sans-serif;
      --block-heart: #ff4d6d;
      --block-heart-empty: #3a2434;
    }
  
    /* ===== score-card (frogoe add) ===== */
    body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 50% 0%, #182031 0%, #0d1220 60%, #080b13 100%);
      }
  
    /* outline floor: every HUD text element reads on any background.
       :where() = zero specificity — block-specific shadows still win. */
    .hud :where(span, b, button, div) {
      text-shadow: 0 2px 0 var(--block-outline, #03040e);
    }
  </style>

body {

            --block-accent: #ffd166;
            --block-fg: #fffdf7;
            --block-font: "Fredoka", "Baloo 2", system-ui, sans-serif;
            --block-outline: #26180a;
    
            display: grid;
            justify-items: center;
            line-height: 1;
            color: var(--block-fg);
            font-family: var(--block-font);
            pointer-events: none;
            -webkit-user-select: none;
            user-select: none;
          }
          .block-combo__label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            text-indent: 0.4em; /* optical center against tracking */
            opacity: 0.75;
          }
          .block-combo__value {
            font-size: clamp(2rem, 9vmin, 3.2rem);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 3px 0 var(--block-outline);
          }
          .block-combo__value[data-pop] {
            animation: block-combo-pop 240ms cubic-bezier(0.34, 1.8, 0.5, 1);
          }
          @keyframes block-combo-pop {
            from {
              transform: scale(1.32) rotate(-2deg);
            }
          }
          /* escalation tiers — derived from the single accent, saturation climbs */
          .block-combo[data-tier="1"] {
            --block-fg: color-mix(in srgb, var(--block-accent) 45%, #fffdf7);
          }
          .block-combo[data-tier="2"] {
            --block-fg: var(--block-accent);
          }
          .block-combo[data-tier="3"] {
            --block-fg: color-mix(in srgb, var(--block-accent) 70%, #ff5d5d);
            animation: block-combo-hot 600ms ease-in-out infinite alternate;
          }
          @keyframes block-combo-hot {
            from {
              scale: 1;
            }
            to {
              scale: 1.06;
            }
          }
          @media (prefers-reduced-motion: reduce) {
            .block-combo__value[data-pop],
            .block-combo[data-tier="3"] {
              animation: none;
            }
          }

/* ===== hud-keyboard (frogoe add) ===== */
body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: end center;
    background: radial-gradient(120% 120% at 50% 0%, #182031 0%, #0d1220 60%, #080b13 100%);
  }
.block-hud-keyboard {
            /* theme — override these */
            --block-key-bg: #fffdf7;
            --block-key-ink: #1e4a73;
            --block-key-press: #ffd166;
            --block-key-edge: #26180a;
            --block-font: "Baloo 2", "Fredoka", system-ui, sans-serif;
    
            bottom: calc(env(safe-area-inset-bottom) + 8px);
            display: grid;
            font-family: var(--block-font);
            gap: 6px;
            grid-template-columns: repeat(10, 1fr);
            left: 50%;
            pointer-events: auto; /* the hud layer is pointer-events: none */
            position: absolute;
            translate: -50% 0;
            width: min(460px, calc(100vw - 16px));
    
            /* hidden until the game opens it */
            opacity: 0;
            pointer-events: none;
            transition: opacity 160ms ease, translate 160ms ease;
          }
          .block-hud-keyboard[data-open] {
            opacity: 1;
            pointer-events: auto;
          }
          .block-hud-keyboard__row {
            display: grid;
            gap: 6px;
            grid-column: 1 / -1;
            grid-template-columns: repeat(10, 1fr);
          }
          .block-hud-keyboard__row--offset-a {
            padding-left: calc(5% + 3px);
          }
          .block-hud-keyboard__row--offset-z {
            padding-left: calc(15% + 6px);
          }
          .block-hud-keyboard__key {
            -webkit-appearance: none;
            appearance: none;
            background: var(--block-key-bg);
            border: none;
            border-radius: 10px;
            box-shadow: 0 3px 0 var(--block-key-edge);
            color: var(--block-key-ink);
            cursor: pointer;
            font-family: inherit;
            font-size: clamp(1rem, 4.4vmin, 1.35rem);
            font-weight: 700;
            height: clamp(44px, 8.5vmin, 56px);
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
            text-shadow: 0 2px 0 var(--block-key-edge);
          }
          .block-hud-keyboard__key[data-pressed],

          }
          @media (prefers-reduced-motion: reduce) {
            .block-hud-keyboard__key[data-pressed],
            .block-hud-keyboard__key:active {

<div class="hud">
    <!-- registry blocks land here (frogoe add score-card) -->
  
      <!-- frogoe:block:score-card -->
      <div data-pos="top-left">
        <!--
          frogoe block: score-card
          Big chunky score number + label. Reads on any background.
        
          Bind from game.js (vanilla, no helper):
            document.querySelector("[data-block-score]").textContent = 1240;
        
          Theme: every visual is a custom property — retheme by overriding
          --block-* on .block-score-card (or on a parent, e.g. body or .block-layer).
        -->
        
            <div class="block-score-card">
              <span class="block-score-card__label">Score</span>
              <span class="block-score-card__value" data-block-score>0</span>
            </div>
      </div>
      <!-- frogoe:block:score-card -->
      <!-- frogoe:block:hearts-row -->
      <div data-pos="top-center">
        <!--
          frogoe block: hearts-row
          Lives / health as a row of hearts. Filled hearts on the left, lost hearts
          ghost on the right; a lost heart pops as it empties.
        
          Bind from game.js (vanilla, no helper):
            const row = document.querySelector("[data-block-hearts]");
            row.dataset.value = String(lives);          // hearts shown as full
            // data-block-hearts element carries: data-value (full), data-max (slots)
        
          Theme: --block-heart (fill), --block-heart-empty (ghost), --block-outline.
        -->
        
            <div class="block-hearts-row" data-block-hearts data-value="3" data-max="3">
              <span class="block-hearts-row__heart"></span>
              <span class="block-hearts-row__heart"></span>
              <span class="block-hearts-row__heart"></span>
              <!-- hearts are managed by the game script: set data-value, then update
               each child's aria-hidden (full: remove; lost: set). Demo shows the
               six-line binder. More slots? Add more <span> children. -->
            </div>
      </div>
      <!-- frogoe:block:hearts-row -->
      <!-- frogoe:block:combo-counter -->
      <div data-pos="top-right">
        <!--
          frogoe block: combo-counter
          Streak/combo readout with escalation tiers — the number grows legs as the
          streak climbs. Tiers are semantic (streak heat), licensed escalation.
        
          Bind from game.js (vanilla, no helper):
            const el = document.querySelector("[data-block-combo]");
            el.textContent = String(streak);
            el.parentElement.dataset.tier = streak >= 12 ? "3" : streak >= 6 ? "2" : streak >= 3 ? "1" : "0";
            el.parentElement.toggleAttribute("data-hot", streak >= 3);
        
          Theme: --block-accent (tier colors derive from it), --block-fg, --block-outline.
        -->
        
            <div class="block-combo" data-tier="0">
              <span class="block-combo__label">Combo</span>
              <span class="block-combo__value" data-block-combo>0</span>
            </div>
      </div>
      <!-- frogoe:block:combo-counter -->
      <!-- frogoe:block:ready-hint -->
      <div data-pos="top-left">
        <!--
          frogoe block: ready-hint
          The living-ready-state affordance: a giant verb instruction that breathes
          while it waits, and vanishes the moment play starts. This is what replaces
          a start menu — the world is alive, this tells the player their one move.
        
          Bind from game.js (vanilla, no helper):
            const hint = document.querySelector("[data-block-ready]");
            hint.toggleAttribute("data-hidden", phase !== "ready");
            hint.querySelector("[data-block-verb]").textContent = "TAP"; // or HOLD / DRAG
        
          Theme: --block-accent, --block-fg, --block-outline, --block-font.
        -->
        
            <div class="block-ready" data-block-ready>
              <span class="block-ready__verb" data-block-verb>TAP</span>
              <span class="block-ready__sub" data-block-sub>to start</span>
            </div>
      </div>
      <!-- frogoe:block:ready-hint -->
      <!-- frogoe:block:game-over-card -->
      <div>
        <!--
          frogoe block: game-over-card
          End-of-run card: title, score, best, one chunky retry button. Hidden by
          default; the game shows it on death and wires the button to restart.
          Entrance pops in; NEW BEST state is a data attribute that flips the
          subtitle and tints the accent.
        
          Bind from game.js (vanilla, no helper):
            const card = document.querySelector("[data-block-gameover]");
            card.querySelector("[data-block-final]").textContent = score;
            card.querySelector("[data-block-best]").textContent = best;
            card.toggleAttribute("data-new-best", isNewBest);
            card.showModal === undefined; // it is a plain overlay:
            card.toggleAttribute("data-open", true);
            card.querySelector("[data-block-retry]").addEventListener("click", () => {
              location.reload(); // or your own reset
            });
        
          Theme: --block-card, --block-accent, --block-cta, --block-cta-label, --block-font.
        -->
        
            <div class="block-game-over" data-block-gameover>
              <div class="block-game-over__card">
                <span class="block-game-over__title">Run Over</span>
                <span class="block-game-over__subtitle" data-block-subtitle>Score</span>
                <span class="block-game-over__score" data-block-final>0</span>
                <span class="block-game-over__best">Best <b data-block-best>0</b></span>
                <button class="block-game-over__retry" type="button" data-block-retry>Retry</button>
              </div>
            </div>
      </div>
      <!-- frogoe:block:game-over-card -->
      <!-- frogoe:block:hud-keyboard -->
      <div data-pos="top-left">
        <!--
          frogoe block: hud-keyboard
          On-screen keyboard for the `type` verb. Presses dispatch REAL
          KeyboardEvents on window, so the frogoe contract hears them natively:
          input.on("key") fires and input.keys tracks held codes — exactly like a
          hardware keyboard. Zero game-side glue.
        
          Theme: every visual is a custom property — retheme by overriding
          --block-* on .block-hud-keyboard (or a parent, e.g. body or .hud).
        
          Show/hide: toggle [data-open] (the game reveals it when typing starts,
          hides it on the game-over card).
        -->
        
            <div class="block-hud-keyboard" data-block-keyboard>
              <div class="block-hud-keyboard__row">
                <button class="block-hud-keyboard__key" data-block-key data-key="q" data-code="KeyQ" type="button">q</button>

                <button class="block-hud-keyboard__key" data-block-key data-key="e" data-code="KeyE" type="button">e</button>

                <button class="block-hud-keyboard__key" data-block-key data-key="y" data-code="KeyY" type="button">y</button>
                <button class="block-hud-keyboard__key" data-block-key data-key="u" data-code="KeyU" type="button">u</button>

                <button class="block-hud-keyboard__key" data-block-key data-key="p" data-code="KeyP" type="button">p</button>
              </div>
              <div class="block-hud-keyboard__row block-hud-keyboard__row--offset-a">
                <button class="block-hud-keyboard__key" data-block-key data-key="a" data-code="KeyA" type="button">a</button>
                <button class="block-hud-keyboard__key" data-block-key data-key="s" data-code="KeyS" type="button">s</button>
                <button class="block-hud-keyboard__key" data-block-key data-key="d" data-code="KeyD" type="button">d</button>

                <button class="block-hud-keyboard__key block-hud-keyboard__key--wide" data-block-key data-key=" " data-code="Space" style="grid-column: span 4" type="button">space</button>
                <button class="block-hud-keyboard__key block-hud-keyboard__key--wide" data-block-key data-key="Enter" data-code="Enter" style="grid-column: span 4" type="button">↵ enter</button>

      </div>
      <!-- frogoe:block:hud-keyboard --></div>
  <script>
              // Self-contained dispatch: presses emit REAL KeyboardEvents on
              // window, so the frogoe contract (input.on("key"), input.keys)
              // receives them exactly like hardware keys. One edge per press —
              // held state is the reader's business (poll input.keys).
              (() => {
                const board = document.querySelector(".block-hud-keyboard");
                if (!board || board.dataset.frogoeBound) return;
                board.dataset.frogoeBound = "1";
                const held = new Map(); // pointerId → button
                const emit = (button, dir) => {
                  window.dispatchEvent(
                    new KeyboardEvent(dir === "down" ? "keydown" : "keyup", {
                      bubbles: true,
                      cancelable: true,
                      code: button.dataset.code ?? "",
                      key: button.dataset.key ?? "",
                    }),
                  );
                };
                const press = (button, id) => {
                  if (held.has(id)) return; // one key per pointer
                  held.set(id, button);
                  button.toggleAttribute("data-pressed", true);
                  emit(button, "down");
                };
                const release = (id) => {
                  const button = held.get(id);
                  if (!button) return;
                  held.delete(id);
                  button.toggleAttribute("data-pressed", false);
                  emit(button, "up");
                };
                board.addEventListener("pointerdown", (e) => {
                  const button = e.target.closest?.("button[data-key]");
                  if (!button) return;
                  e.preventDefault();
                  press(button, e.pointerId);
                });
                board.addEventListener("contextmenu", (e) => e.preventDefault());
                window.addEventListener("pointerup", (e) => release(e.pointerId));
                window.addEventListener("pointercancel", (e) => release(e.pointerId));
                window.addEventListener("blur", () => {
                  for (const id of [...held.keys()]) release(id);
                });
              })();
            </script>
  <script type="module" src="game.js"></script>
</body>
