name: Publish to npm

# Zero-memory release pipeline (guardrails in the HyperFrames tradition):
#   conventional commits (commitlint-enforced) → release-please PR → merge
#   → THIS workflow → npm (trusted publishing, no tokens).
#
# TRIGGER DESIGN (the load-bearing detail): tags pushed by release-please
# use GITHUB_TOKEN, and GitHub deliberately never triggers workflows from
# GITHUB_TOKEN events — a tag trigger would fire only for HUMAN-pushed
# tags. So stable publishes ride the release-PR merge event; hyphenated
# prerelease tags (pushed by humans) keep the tag trigger; workflow_dispatch
# is the recovery hatch for anything the automatisms miss.
permissions: {}

on:
  push:
    tags:
      # Prerelease channels only: hyphenated versions, human-pushed.
      - "v*-*"
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub environment: add a required reviewer here later for an
    # approval gate on every publish.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN secret
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release-please--'))
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          # pin to the exact release commit: main may advance before this
          # job starts, and merge events expose a moving github.ref
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Resolve version + channel
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${REF_NAME#v}"
          else
            # release-PR merge / dispatch: the bump already lives in the
            # tree at this exact commit
            VERSION="$(node -p "require('./packages/cli/package.json').version")"
          fi
          RESOLVED="$(node scripts/release-guards.mjs resolve "$VERSION")"
          echo "$RESOLVED" | tee -a "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Recovery dispatch: main may have advanced past the release commit —
      # pin the run to the commit the release tag actually points at (the
      # version's true content), after verifying it belongs to this branch.
      - name: Recovery dispatch pins to the release commit
        if: github.event_name == 'workflow_dispatch' && steps.version.outputs.channel == 'stable'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          git fetch --force --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          COMMIT="$(git rev-parse "${TAG}^{commit}" 2>/dev/null || true)"
          if [ -z "$COMMIT" ]; then
            echo "::error::${TAG} does not exist — nothing to recover"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT" HEAD; then
            echo "::error::${TAG} is not on this branch"
            exit 1
          fi
          git checkout --detach "$COMMIT"
          echo "RELEASE_SHA=$COMMIT" >> "$GITHUB_ENV"

      - name: Expected release sha
        run: |
          if [ -n "${RELEASE_SHA:-}" ]; then :
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "RELEASE_SHA=${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      # The release tag must exist and point at exactly this commit. The
      # bot normally creates it seconds after the merge; wait out the race
      # instead of needing write permissions to create it ourselves.
      - name: Release tag must point at this commit
        if: steps.version.outputs.channel == 'stable'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          EXPECTED="$(git rev-parse HEAD)"
          for _ in $(seq 1 12); do
            git fetch --force --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
            if git rev-parse "${TAG}^{commit}" >/dev/null 2>&1; then break; fi
            echo "waiting for the bot to create ${TAG}…"
            sleep 10
          done
          ACTUAL="$(git rev-parse "${TAG}^{commit}" 2>/dev/null || true)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::tag ${TAG} points at '${ACTUAL:-<absent>}' but this release is ${EXPECTED}"
            exit 1
          fi

      # Immutable release checkout: publish exactly what was released, even
      # if main advances between merge and this job (HyperFrames lesson).
      - name: Verify immutable release checkout
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "${RELEASE_SHA}" ]; then
            echo "::error::expected ${RELEASE_SHA}, checked out $ACTUAL"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run verify

      # the tarball ships dist/ — tests run from src and pass without it,
      # so the build must happen here, explicitly, and the packed artifact
      # is verified BEFORE it can ever reach npm (verify:packed-manifests,
      # the HyperFrames lesson — a gutted tarball is worse than a failed
      # release: unpublish windows are narrow)
      - run: bun run build
        working-directory: packages/cli
      - name: Packed tarball must carry the built CLI
        working-directory: packages/cli
        run: |
          npm pack --dry-run > /tmp/pack.log 2>&1 || { cat /tmp/pack.log; exit 1; }
          node "$GITHUB_WORKSPACE/scripts/release-guards.mjs" pack /tmp/pack.log

      # trusted publishing (OIDC) landed in npm 11.5.1 — runner-bundled
      # npm predates it and answers ENEEDAUTH because there is, by design,
      # no token in this workflow
      - name: npm with trusted-publishing support
        run: |
          npm install -g npm@latest >/dev/null
          node "$GITHUB_WORKSPACE/scripts/release-guards.mjs" npm-floor "$(npm --version)"

      - name: Already published? (idempotent retries)
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "frogoe@${VERSION}" version >/dev/null 2>&1; then
            echo "frogoe@${VERSION} already on npm — nothing to do"
            echo "skip_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (provenance-signed, trusted publishing)
        if: steps.published.outputs.skip_publish != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          cd packages/cli
          npm publish --access public --tag "$DIST_TAG" --provenance

      - name: Verify the artifact landed
        if: steps.published.outputs.skip_publish != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for _ in 1 2 3 4 5; do
            if npm view "frogoe@${VERSION}" version >/dev/null 2>&1; then
              echo "frogoe@${VERSION} is live"
              exit 0
            fi
            sleep 10
          done
          echo "::error::frogoe@${VERSION} not visible on npm after publish"
          exit 1
