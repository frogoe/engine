name: Publish to npm

# Zero-memory release pipeline (guardrails in the HyperFrames tradition):
#   conventional commits (commitlint-enforced) → release-please PR → merge
#   → tag vX.Y.Z → THIS workflow → npm (trusted publishing, no tokens).
#
# Stable tags (vX.Y.Z) come only from release-please merges and must sit
# on a commit reachable from main. Hyphenated tags (vX.Y.Z-beta.1) are
# the prerelease channel: they publish with the matching npm dist-tag.
permissions: {}

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub environment: add a required reviewer here later for an
    # approval gate on every publish.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN secret
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Resolve version + channel
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-([0-9A-Za-z-]+) ]]; then
            echo "dist_tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag '${REF_NAME}' is not a version"
            exit 1
          fi

      # Stable releases may only come from reviewed release-please merges:
      # the tag must point at (or descend from) a commit ON main. Direct
      # stable-tag pushes from random branches are rejected.
      - name: Stable tags must be reachable from main
        if: steps.version.outputs.channel == 'stable'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::stable tag points outside main — publish stable releases through the release PR"
            exit 1
          fi

      - name: package.json must match the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package.json is ${PKG_VERSION} but tag says ${VERSION} — the release PR bumps both; never tag by hand"
            exit 1
          fi

      # Immutable release checkout: publish exactly what was tagged, even
      # if main advances between tag and this job (HyperFrames lesson).
      - name: Verify immutable release checkout
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$GITHUB_SHA" ]; then
            echo "::error::expected $GITHUB_SHA, checked out $ACTUAL"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run verify

      - name: Already published? (idempotent retries)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "frogoe@${VERSION}" version >/dev/null 2>&1; then
            echo "frogoe@${VERSION} already on npm — nothing to do"
            echo "skip_publish=true" >> "$GITHUB_OUTPUT"
          fi
        id: published

      - name: Publish (provenance-signed, trusted publishing)
        if: steps.published.outputs.skip_publish != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          cd packages/cli
          npm publish --access public --tag "$DIST_TAG" --provenance

      - name: Verify the artifact landed
        if: steps.published.outputs.skip_publish != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for i in 1 2 3 4 5; do
            if npm view "frogoe@${VERSION}" version >/dev/null 2>&1; then
              echo "frogoe@${VERSION} is live"
              exit 0
            fi
            sleep 10
          done
          echo "::error::frogoe@${VERSION} not visible on npm after publish"
          exit 1
