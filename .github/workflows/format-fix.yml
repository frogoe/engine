name: Format fix

# release-please PRs bump versions by string-replace — they never run
# oxfmt. Without this, every release PR fails verify with "Format issues
# found in above N files" and needs a manual chore: oxfmt follow-up.
# This workflow fixes it in-place, automatically.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  fix:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Sync lockstep versions
        run: node scripts/sync-lockstep-versions.mjs
      - run: bun x oxfmt .
      - name: Push fix if needed
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: oxfmt"
          git push origin HEAD:${{ github.head_ref }}
