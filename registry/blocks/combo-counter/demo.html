<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>frogoe block demo — hud-combo-counter</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 30% 0%, #241a3f 0%, #100b1d 60%, #090612 100%);
        cursor: pointer;
        touch-action: none;
      }
      .hint {
        position: absolute;
        inset: auto 0 10vh;
        text-align: center;
        color: #b9a8d6;
        font-family: system-ui, sans-serif;
        font-size: 0.9rem;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <!-- ===== block copy starts here ===== -->
    <style>
      .block-combo {
        --block-accent: #ffd166;
        --block-fg: #fffdf7;
        --block-font: "Fredoka", "Baloo 2", system-ui, sans-serif;
        --block-outline: #26180a;
        display: grid;
        justify-items: center;
        line-height: 1;
        color: var(--block-fg);
        font-family: var(--block-font);
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .block-combo__label {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        text-indent: 0.4em;
        opacity: 0.75;
      }
      .block-combo__value {
        font-size: clamp(2rem, 9vmin, 3.2rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 3px 0 var(--block-outline);
      }
      .block-combo__value[data-pop] {
        animation: hud-combo-pop 240ms cubic-bezier(0.34, 1.8, 0.5, 1);
      }
      @keyframes hud-combo-pop {
        from {
          transform: scale(1.32) rotate(-2deg);
        }
      }
      .block-combo[data-tier="1"] {
        --block-fg: color-mix(in srgb, var(--block-accent) 45%, #fffdf7);
      }
      .block-combo[data-tier="2"] {
        --block-fg: var(--block-accent);
      }
      .block-combo[data-tier="3"] {
        --block-fg: color-mix(in srgb, var(--block-accent) 70%, #ff5d5d);
        animation: hud-combo-hot 600ms ease-in-out infinite alternate;
      }
      @keyframes hud-combo-hot {
        from {
          scale: 1;
        }
        to {
          scale: 1.06;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .block-combo__value[data-pop],
        .block-combo[data-tier="3"] {
          animation: none;
        }
      }
    </style>
    <div class="block-combo" data-tier="0">
      <span class="block-combo__label">Combo</span>
      <span class="block-combo__value" data-block-combo>0</span>
    </div>
    <!-- ===== block copy ends here ===== -->
    <p class="hint">hold to build streak · release to drop</p>

    <script type="module">
      const box = document.querySelector(".block-combo");
      const value = document.querySelector("[data-block-combo]");
      let streak = 0;
      let holding = false;
      let timer = 0;
      const render = () => {
        value.textContent = String(streak);
        box.dataset.tier = String(streak >= 12 ? 3 : streak >= 6 ? 2 : streak >= 3 ? 1 : 0);
        value.removeAttribute("data-pop");
        void value.offsetWidth;
        value.setAttribute("data-pop", "");
      };
      const tick = () => {
        if (holding) {
          streak += 1;
          render();
          timer = setTimeout(tick, Math.max(120, 480 - streak * 28));
        }
      };
      addEventListener("pointerdown", () => {
        holding = true;
        tick();
      });
      addEventListener("pointerup", () => {
        holding = false;
        streak = 0;
        render();
      });
      addEventListener("pointercancel", () => {
        holding = false;
        streak = 0;
        render();
      });
    </script>
  </body>
</html>
