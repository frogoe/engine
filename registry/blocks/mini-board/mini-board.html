<!doctype html>
<!-- frogoe block source: hud-mini-board — this file IS viewable in a browser (default
     state on a neutral backdrop). Copy ONLY between the markers into your
     game's hud/ layer; the interactive playground is demo.html. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>frogoe block — hud-mini-board</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 50% 0%, #182031 0%, #0d1220 60%, #080b13 100%);
      }
    </style>
  </head>
  <body>
    <!-- ===================== COPY FROM HERE ===================== -->
    <!--
  frogoe block: mini-board
  Top-3 scores in a compact board — the "one more run" social proof. Seeds
  are ORGANIC numbers by doctrine: never round slop (1234567), never
  fake-perfect (99.99%). The player's row is marked; new bests glow once.

  Bind from game.js (vanilla, no helper):
    const board = document.querySelector("[data-block-board]");
    board.querySelector("[data-block-board-r1-score]").textContent = "1,283";
    // rows r1..r3: name + score; [data-block-board-you] marks the player row.
    board.toggleAttribute("data-hidden", false);

  Theme: --block-accent, --block-fg, --block-outline, --block-chip.
-->
    <style>
      .block-board {
        --block-accent: #ffd166;
        --block-chip: rgba(12, 16, 30, 0.55);
        --block-fg: #fffdf7;
        --block-font: "Fredoka", "Baloo 2", system-ui, sans-serif;
        --block-outline: #26180a;

        display: grid;
        gap: 2px; /* razor rows: contrast gap, not borders */
        min-width: 11rem;
        padding: 0.7em 0.9em;
        background: var(--block-chip);
        border: 2px solid rgba(255, 255, 255, 0.14);
        border-radius: 1rem;
        color: var(--block-fg);
        font-family: var(--block-font);
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .block-board__row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: baseline;
        gap: 0.6em;
        padding: 0.25em 0.3em;
        font-size: 0.95rem;
      }
      .block-board__row + .block-board__row {
        background: rgba(255, 255, 255, 0.05);
      }
      .block-board__rank {
        font-weight: 700;
        opacity: 0.6;
        font-variant-numeric: tabular-nums;
      }
      .block-board__name {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .block-board__score {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 0 var(--block-outline);
      }
      .block-board__row[data-block-board-you] {
        background: color-mix(in srgb, var(--block-accent) 16%, transparent);
      }
      .block-board__row[data-block-board-you] .block-board__name {
        color: var(--block-accent);
      }
      .block-board[data-fresh-best] .block-board__row[data-block-board-you] .block-board__score {
        animation: hud-board-best 700ms cubic-bezier(0.34, 1.8, 0.5, 1);
      }
      @keyframes hud-board-best {
        from {
          transform: scale(1.35);
          color: var(--block-accent);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .block-board[data-fresh-best] .block-board__row[data-block-board-you] .block-board__score {
          animation: none;
        }
      }
    </style>

    <div class="block-board" data-block-board>
      <div class="block-board__row">
        <span class="block-board__rank">1</span>
        <span class="block-board__name" data-block-board-r1-name>muja</span>
        <span class="block-board__score" data-block-board-r1-score>1,283</span>
      </div>
      <div class="block-board__row">
        <span class="block-board__rank">2</span>
        <span class="block-board__name" data-block-board-r2-name>kiri</span>
        <span class="block-board__score" data-block-board-r2-score>947</span>
      </div>
      <div class="block-board__row" data-block-board-you>
        <span class="block-board__rank">3</span>
        <span class="block-board__name" data-block-board-r3-name>you</span>
        <span class="block-board__score" data-block-board-r3-score>512</span>
      </div>
    </div>
    <!-- ===================== COPY TO HERE ======================= -->
  </body>
</html>
