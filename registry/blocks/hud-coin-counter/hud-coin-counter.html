<!doctype html>
<!-- frogoe block source: hud-coin-counter — this file IS viewable in a browser (default
     state on a neutral backdrop). Copy ONLY between the markers into your
     game's hud/ layer; the interactive playground is demo.html. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>frogoe block — hud-coin-counter</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 50% 0%, #182031 0%, #0d1220 60%, #080b13 100%);
      }
    </style>
  </head>
  <body>
    <!-- ===================== COPY FROM HERE ===================== -->
    <!--
  frogoe block: hud-coin-counter
  Icon + animated count-up number — the classic corner pickup counter.

  Bind from game.js (vanilla, no helper):
    const el = document.querySelector("[data-hud-coins]");
    el.textContent = String(coins);            // count up in your loop or instantly
    el.parentElement.setAttribute("data-gain", "");  // restart the gain pop

  Theme: --hud-accent, --hud-fg, --hud-outline, --hud-font.
-->
    <style>
      .hud-coin-counter {
        --hud-accent: #ffd166;
        --hud-fg: #fffdf7;
        --hud-font: "Fredoka", "Baloo 2", system-ui, sans-serif;
        --hud-outline: #26180a;

        display: flex;
        align-items: center;
        gap: 0.45em;
        color: var(--hud-fg);
        font-family: var(--hud-font);
        font-weight: 700;
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .hud-coin-counter__coin {
        width: 1.35em;
        height: 1.35em;
        flex: none;
        border-radius: 50%;
        background: var(--hud-accent);
        /* machined coin: inner ring + top-left light, no icon font */
        box-shadow:
          inset 0 0 0 0.14em color-mix(in srgb, var(--hud-accent) 55%, #fff),
          inset -0.08em -0.12em 0 0 color-mix(in srgb, var(--hud-accent) 60%, #000),
          0 2px 0 var(--hud-outline);
      }
      .hud-coin-counter__value {
        font-size: clamp(1.1rem, 4.5vmin, 1.5rem);
        font-variant-numeric: tabular-nums;
        text-shadow: 0 2px 0 var(--hud-outline);
        min-width: 3ch;
      }
      .hud-coin-counter[data-gain] .hud-coin-counter__value {
        animation: hud-coin-gain 260ms cubic-bezier(0.34, 1.8, 0.5, 1);
      }
      .hud-coin-counter[data-gain] .hud-coin-counter__coin {
        animation: hud-coin-spin 420ms cubic-bezier(0.34, 1.56, 0.5, 1);
      }
      @keyframes hud-coin-gain {
        from {
          transform: scale(1.3);
        }
      }
      @keyframes hud-coin-spin {
        40% {
          transform: rotateY(180deg) scale(1.12);
        }
        100% {
          transform: rotateY(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hud-coin-counter[data-gain] .hud-coin-counter__value,
        .hud-coin-counter[data-gain] .hud-coin-counter__coin {
          animation: none;
        }
      }
    </style>

    <div class="hud-coin-counter">
      <span class="hud-coin-counter__coin"></span>
      <span class="hud-coin-counter__value" data-hud-coins>0</span>
    </div>
    <!-- ===================== COPY TO HERE ======================= -->
  </body>
</html>
