<!doctype html>
<!-- Demo for hud-fuel-gauge — hold anywhere to burn fuel, release to refuel. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>frogoe block demo — hud-fuel-gauge</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 2.5rem;
        background: radial-gradient(120% 120% at 20% 100%, #2c2135 0%, #140f1e 55%, #0a0710 100%);
        color: #efe6f7;
        font-family: system-ui, sans-serif;
        cursor: pointer;
        touch-action: none;
      }
      .hint {
        font-size: 0.9rem;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <!-- ===== block copy starts here ===== -->
    <style>
      .hud-fuel-gauge {
        --hud-accent: #ffd166;
        --hud-danger: #ff5d5d;
        --hud-fill-color: var(--hud-accent);
        --hud-font: "Fredoka", "Baloo 2", system-ui, sans-serif;
        --hud-outline: #26180a;
        --hud-track: rgba(10, 14, 26, 0.55);
        --hud-width: clamp(9rem, 34vmin, 13rem);
        display: flex;
        align-items: center;
        gap: 0.55em;
        color: #fffdf7;
        font-family: var(--hud-font);
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .hud-fuel-gauge__icon {
        width: 1.5em;
        height: 1.5em;
        flex: none;
        background: var(--hud-accent);
        -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M19.77 7.23l-.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33 0 1.38 1.12 2.5 2.5 2.5.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v2.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z'/></svg>")
          center / contain no-repeat;
        mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M19.77 7.23l-.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33 0 1.38 1.12 2.5 2.5 2.5.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v2.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z'/></svg>")
          center / contain no-repeat;
        filter: drop-shadow(0 2px 0 var(--hud-outline));
      }
      .hud-fuel-gauge__track {
        position: relative;
        width: var(--hud-width);
        height: 1.15em;
        background: var(--hud-track);
        border: 2px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        overflow: hidden;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.35);
      }
      .hud-fuel-gauge__fill {
        --hud-fill: 100%;
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--hud-fill);
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--hud-fill-color) 78%, white) 0%,
          var(--hud-fill-color) 55%,
          color-mix(in srgb, var(--hud-fill-color) 72%, black) 100%
        );
        border-radius: inherit;
        transition: width 240ms ease-out;
      }
      .hud-fuel-gauge__label {
        font-size: 0.95rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 2px 0 var(--hud-outline);
        min-width: 3ch;
      }
      .hud-fuel-gauge[data-low] {
        --hud-fill-color: var(--hud-danger);
      }
      .hud-fuel-gauge[data-low] .hud-fuel-gauge__fill {
        animation: hud-fuel-low 640ms ease-in-out infinite alternate;
      }
      @keyframes hud-fuel-low {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hud-fuel-gauge__fill {
          transition: none;
        }
        .hud-fuel-gauge[data-low] .hud-fuel-gauge__fill {
          animation: none;
        }
      }
    </style>
    <div class="hud-fuel-gauge" data-hud-fuel>
      <span class="hud-fuel-gauge__icon"></span>
      <span class="hud-fuel-gauge__track">
        <span class="hud-fuel-gauge__fill"></span>
      </span>
      <span class="hud-fuel-gauge__label" data-hud-fuel-label>100</span>
    </div>
    <!-- ===== block copy ends here ===== -->

    <p class="hint">hold to burn · release to refuel</p>

    <script type="module">
      const gauge = document.querySelector("[data-hud-fuel]");
      const fill = gauge.querySelector(".hud-fuel-gauge__fill");
      const label = gauge.querySelector("[data-hud-fuel-label]");
      let fuel = 100;
      let burning = false;
      let last = performance.now();

      const render = () => {
        fill.style.setProperty("--hud-fill", `${fuel}%`);
        label.textContent = String(Math.ceil(fuel));
        gauge.toggleAttribute("data-low", fuel < 25);
      };
      const tick = (now) => {
        const dt = (now - last) / 1000;
        last = now;
        fuel = Math.min(100, Math.max(0, fuel + (burning ? -18 : 26) * dt));
        render();
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);

      addEventListener("pointerdown", () => {
        burning = true;
      });
      addEventListener("pointerup", () => {
        burning = false;
      });
      addEventListener("pointercancel", () => {
        burning = false;
      });
    </script>
  </body>
</html>
