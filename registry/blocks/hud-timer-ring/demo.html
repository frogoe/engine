<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>frogoe block demo — hud-timer-ring</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 70% 0%, #12303a 0%, #0a1a20 60%, #050f13 100%);
        cursor: pointer;
      }
      .hint {
        position: absolute;
        inset: auto 0 10vh;
        text-align: center;
        color: #a9d3d6;
        font-family: system-ui, sans-serif;
        font-size: 0.9rem;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <!-- ===== block copy starts here ===== -->
    <style>
      .hud-timer-ring {
        --hud-accent: #ffd166;
        --hud-danger: #ff5d5d;
        --hud-fg: #fffdf7;
        --hud-font: "Fredoka", "Baloo 2", system-ui, sans-serif;
        --hud-left: 1;
        --hud-outline: #26180a;
        --hud-ring-color: var(--hud-accent);
        --hud-size: clamp(3.4rem, 13vmin, 4.6rem);
        --hud-track: rgba(10, 14, 26, 0.5);
        position: relative;
        width: var(--hud-size);
        height: var(--hud-size);
        color: var(--hud-fg);
        font-family: var(--hud-font);
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .hud-timer-ring svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }
      .hud-timer-ring__track {
        fill: var(--hud-track);
        stroke: rgba(255, 255, 255, 0.14);
        stroke-width: 6;
      }
      .hud-timer-ring__arc {
        fill: none;
        stroke: var(--hud-ring-color);
        stroke-width: 6;
        stroke-linecap: round;
        stroke-dasharray: 100;
        stroke-dashoffset: calc(100 - (100 * var(--hud-left)));
        transition:
          stroke-dashoffset 240ms ease-out,
          stroke 160ms ease;
        filter: drop-shadow(0 2px 0 var(--hud-outline));
      }
      .hud-timer-ring__label {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: calc(var(--hud-size) * 0.3);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 2px 0 var(--hud-outline);
      }
      .hud-timer-ring[data-low] {
        --hud-ring-color: var(--hud-danger);
      }
      .hud-timer-ring[data-low] .hud-timer-ring__label {
        animation: hud-ring-low 640ms ease-in-out infinite alternate;
      }
      @keyframes hud-ring-low {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hud-timer-ring__arc {
          transition: none;
        }
        .hud-timer-ring[data-low] .hud-timer-ring__label {
          animation: none;
        }
      }
    </style>
    <div class="hud-timer-ring" data-hud-timer>
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle class="hud-timer-ring__track" cx="20" cy="20" r="16"></circle>
        <circle class="hud-timer-ring__arc" cx="20" cy="20" r="16"></circle>
      </svg>
      <span class="hud-timer-ring__label" data-hud-timer-label>45</span>
    </div>
    <!-- ===== block copy ends here ===== -->
    <p class="hint">tap to reset the countdown</p>

    <script type="module">
      const ring = document.querySelector("[data-hud-timer]");
      const label = ring.querySelector("[data-hud-timer-label]");
      let left = 45;
      const total = 45;
      setInterval(() => {
        left = left <= 0 ? total : left - 1;
        const fraction = left / total;
        ring.style.setProperty("--hud-left", fraction.toFixed(3));
        ring.toggleAttribute("data-low", fraction < 0.25);
        label.textContent = String(left);
      }, 1000);
    </script>
  </body>
</html>
