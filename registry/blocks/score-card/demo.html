<!doctype html>
<!-- Demo for score-card — open in a browser, watch the score climb. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>frogoe block demo — score-card</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 20% 0%, #1d2a55 0%, #0c1022 60%, #070a18 100%);
      }
      /* retheme example: candy palette instead of the default gold */
      .demo-theme {
        --block-accent: #7ef2c9;
        --block-outline: #07281e;
      }
    </style>
  </head>
  <body>
    <div class="demo-theme">
      <!-- ===== block copy starts here ===== -->
      <style>
        .block-score-card {
          --block-accent: #ffd166;
          --block-fg: #fffdf7;
          --block-font: "Fredoka", "Baloo 2", system-ui, sans-serif;
          --block-outline: #26180a;
          --block-size: clamp(2.4rem, 9vmin, 3.6rem);
          color: var(--block-fg);
          font-family: var(--block-font);
          font-size: var(--block-size);
          font-weight: 700;
          line-height: 1;
          text-align: center;
          -webkit-user-select: none;
          user-select: none;
          pointer-events: none;
        }
        .block-score-card__label {
          display: block;
          font-size: 0.32em;
          font-weight: 600;
          letter-spacing: 0.35em;
          text-transform: uppercase;
          opacity: 0.85;
        }
        .block-score-card__value {
          display: block;
          font-variant-numeric: tabular-nums;
          text-shadow:
            0 0.09em 0 var(--block-outline),
            0 0.16em 0.24em rgba(0, 0, 0, 0.35);
        }
        .block-score-card__value[data-bump] {
          animation: block-score-bump 240ms cubic-bezier(0.34, 1.8, 0.5, 1);
        }
        @keyframes block-score-bump {
          from {
            transform: scale(1.28);
          }
          to {
            transform: scale(1);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .block-score-card__value[data-bump] {
            animation: none;
          }
        }
      </style>
      <div class="block-score-card">
        <span class="block-score-card__label">Score</span>
        <span class="block-score-card__value" data-block-score>0</span>
      </div>
      <!-- ===== block copy ends here ===== -->
    </div>

    <script type="module">
      const value = document.querySelector("[data-block-score]");
      let score = 0;
      setInterval(() => {
        score += 120 + Math.floor(Math.random() * 260);
        value.textContent = score.toLocaleString("en-US");
        value.removeAttribute("data-bump");
        void value.offsetWidth; // restart the pop animation
        value.setAttribute("data-bump", "");
      }, 900);
    </script>
  </body>
</html>
