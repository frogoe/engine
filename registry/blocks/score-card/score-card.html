<!doctype html>
<!-- frogoe block source: hud-score-card — this file IS viewable in a browser (default
     state on a neutral backdrop). Copy ONLY between the markers into your
     game's hud/ layer; the interactive playground is demo.html. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>frogoe block — hud-score-card</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 50% 0%, #182031 0%, #0d1220 60%, #080b13 100%);
      }
    </style>
  </head>
  <body>
    <!-- ===================== COPY FROM HERE ===================== -->
    <!--
  frogoe block: score-card
  Big chunky score number + label. Reads on any background.

  Bind from game.js (vanilla, no helper):
    document.querySelector("[data-block-score]").textContent = 1240;

  Theme: every visual is a custom property — retheme by overriding
  --block-* on .block-score-card (or on a parent, e.g. body or .block-layer).
-->
    <style>
      .block-score-card {
        /* theme — override these */
        --block-accent: #ffd166;
        --block-fg: #fffdf7;
        --block-font: "Fredoka", "Baloo 2", system-ui, sans-serif;
        --block-outline: #26180a;
        --block-size: clamp(2.4rem, 9vmin, 3.6rem);

        color: var(--block-fg);
        font-family: var(--block-font);
        font-size: var(--block-size);
        font-weight: 700;
        line-height: 1;
        text-align: center;
        -webkit-user-select: none;
        user-select: none;
        pointer-events: none;
      }
      .block-score-card__label {
        display: block;
        font-size: 0.32em;
        font-weight: 600;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        opacity: 0.85;
      }
      .block-score-card__value {
        display: block;
        font-variant-numeric: tabular-nums;
        /* sticker depth: hard offset shadow, no blur */
        text-shadow:
          0 0.09em 0 var(--block-outline),
          0 0.16em 0.24em rgba(0, 0, 0, 0.35);
      }
      .block-score-card__value[data-bump] {
        /* score changed this frame — game toggles the attribute to fire the pop */
        animation: hud-score-bump 240ms cubic-bezier(0.34, 1.8, 0.5, 1);
      }
      @keyframes hud-score-bump {
        from {
          transform: scale(1.28);
        }
        to {
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .block-score-card__value[data-bump] {
          animation: none;
        }
      }
    </style>

    <div class="block-score-card">
      <span class="block-score-card__label">Score</span>
      <span class="block-score-card__value" data-block-score>0</span>
    </div>
    <!-- ===================== COPY TO HERE ======================= -->
  </body>
</html>
