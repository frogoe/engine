<!doctype html>
<!-- frogoe block source: hud-game-over-card — this file IS viewable in a browser (default
     state on a neutral backdrop). Copy ONLY between the markers into your
     game's hud/ layer; the interactive playground is demo.html. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>frogoe block — hud-game-over-card</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 50% 0%, #182031 0%, #0d1220 60%, #080b13 100%);
      }
    </style>
  </head>
  <body>
    <!-- ===================== COPY FROM HERE ===================== -->
    <!--
  frogoe block: hud-game-over-card
  End-of-run card: title, score, best, one chunky retry button. Hidden by
  default; the game shows it on death and wires the button to restart.
  Entrance pops in; NEW BEST state is a data attribute that flips the
  subtitle and tints the accent.

  Bind from game.js (vanilla, no helper):
    const card = document.querySelector("[data-hud-gameover]");
    card.querySelector("[data-hud-final]").textContent = score;
    card.querySelector("[data-hud-best]").textContent = best;
    card.toggleAttribute("data-new-best", isNewBest);
    card.showModal === undefined; // it is a plain overlay:
    card.toggleAttribute("data-open", true);
    card.querySelector("[data-hud-retry]").addEventListener("click", () => {
      location.reload(); // or your own reset
    });

  Theme: --hud-card, --hud-accent, --hud-cta, --hud-cta-label, --hud-font.
-->
    <style>
      .hud-game-over {
        --hud-accent: #ffd166;
        --hud-card: #171d2e;
        --hud-cta: #ffcf3f;
        --hud-cta-label: #241a06;
        --hud-font: "Fredoka", "Baloo 2", system-ui, sans-serif;
        --hud-outline: #0a0e1a;

        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(4, 6, 12, 0.55);
        font-family: var(--hud-font);
        color: #fffdf7;
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
        -webkit-user-select: none;
        user-select: none;
      }
      .hud-game-over[data-open] {
        opacity: 1;
        pointer-events: auto;
      }
      .hud-game-over__card {
        display: grid;
        justify-items: center;
        gap: 0.35em;
        min-width: min(78vw, 20rem);
        padding: 2rem 2.4rem 2.2rem;
        background: var(--hud-card);
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.6rem;
        box-shadow: 0 1.2rem 3rem rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      .hud-game-over[data-open] .hud-game-over__card {
        animation: hud-card-in 320ms cubic-bezier(0.34, 1.56, 0.5, 1);
      }
      @keyframes hud-card-in {
        from {
          transform: translateY(1.2rem) scale(0.92);
          opacity: 0;
        }
      }
      .hud-game-over__title {
        font-size: clamp(1.6rem, 7vmin, 2.4rem);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-shadow: 0 3px 0 var(--hud-outline);
      }
      .hud-game-over__subtitle {
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        opacity: 0.6;
      }
      .hud-game-over[data-new-best] .hud-game-over__subtitle {
        color: var(--hud-accent);
        opacity: 1;
        animation: hud-best-pulse 800ms ease-in-out infinite alternate;
      }
      @keyframes hud-best-pulse {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.55;
        }
      }
      .hud-game-over__score {
        font-size: clamp(2.6rem, 12vmin, 4rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
        text-shadow: 0 4px 0 var(--hud-outline);
      }
      .hud-game-over__best {
        font-size: 0.95rem;
        font-weight: 600;
        opacity: 0.75;
      }
      .hud-game-over__retry {
        margin-top: 0.9em;
        font-family: inherit;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--hud-cta-label);
        background: var(--hud-cta);
        border: none;
        border-radius: 999px;
        padding: 0.85em 2.6em;
        cursor: pointer;
        /* chunky button: hard extrusion under, push-in on press */
        box-shadow: 0 5px 0 color-mix(in srgb, var(--hud-cta) 62%, black);
        transition:
          transform 80ms ease,
          box-shadow 80ms ease;
      }
      .hud-game-over__retry:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 color-mix(in srgb, var(--hud-cta) 62%, black);
      }
      @media (prefers-reduced-motion: reduce) {
        .hud-game-over[data-open] .hud-game-over__card {
          animation: none;
        }
        .hud-game-over[data-new-best] .hud-game-over__subtitle {
          animation: none;
        }
        .hud-game-over {
          transition: none;
        }
      }
    </style>

    <div class="hud-game-over" data-hud-gameover>
      <div class="hud-game-over__card">
        <span class="hud-game-over__title">Run Over</span>
        <span class="hud-game-over__subtitle" data-hud-subtitle>Score</span>
        <span class="hud-game-over__score" data-hud-final>0</span>
        <span class="hud-game-over__best">Best <b data-hud-best>0</b></span>
        <button class="hud-game-over__retry" type="button" data-hud-retry>Retry</button>
      </div>
    </div>
    <!-- ===================== COPY TO HERE ======================= -->

    <!-- preview-only: games toggle data-open themselves; this script exists so
     the source file shows its open state when opened directly -->
    <script type="module">
      const card = document.querySelector("[data-hud-gameover]");
      card.toggleAttribute("data-open", true);
      card.querySelector("[data-hud-retry]").addEventListener("click", () => {
        card.toggleAttribute("data-open", false);
        setTimeout(() => card.toggleAttribute("data-open", true), 700);
      });
    </script>
  </body>
</html>
