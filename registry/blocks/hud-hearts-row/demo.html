<!doctype html>
<!-- Demo for hud-hearts-row — hearts drain on tap, refill at zero. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>frogoe block demo — hud-hearts-row</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 3rem;
        grid-auto-flow: row;
        background: radial-gradient(120% 120% at 80% 0%, #23303f 0%, #101722 60%, #090d14 100%);
        color: #dfe9f2;
        font-family: system-ui, sans-serif;
        cursor: pointer;
      }
      .hint {
        font-size: 0.9rem;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <!-- ===== block copy starts here ===== -->
    <style>
      .hud-hearts-row {
        --hud-gap: 0.5em;
        --hud-heart: #ff4d6d;
        --hud-heart-empty: rgba(255, 255, 255, 0.18);
        --hud-outline: #33101d;
        --hud-size: clamp(1.4rem, 5vmin, 2rem);
        display: flex;
        gap: var(--hud-gap);
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .hud-hearts-row__heart {
        width: var(--hud-size);
        height: var(--hud-size);
        background: var(--hud-heart);
        -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>")
          center / contain no-repeat;
        mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>")
          center / contain no-repeat;
        filter: drop-shadow(0 2px 0 var(--hud-outline)) drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }
      .hud-hearts-row__heart[aria-hidden="true"] {
        background: var(--hud-heart-empty);
        filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.25));
        transform: scale(0.86);
        animation: hud-heart-pop 320ms cubic-bezier(0.34, 1.8, 0.5, 1);
      }
      @keyframes hud-heart-pop {
        from {
          transform: scale(1.35) rotate(-8deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hud-hearts-row__heart,
        .hud-hearts-row__heart[aria-hidden="true"] {
          animation: none;
          transition: none;
        }
      }
    </style>
    <div class="hud-hearts-row" data-hud-hearts data-value="3" data-max="3">
      <span class="hud-hearts-row__heart"></span>
      <span class="hud-hearts-row__heart"></span>
      <span class="hud-hearts-row__heart"></span>
    </div>
    <!-- ===== block copy ends here ===== -->

    <p class="hint">tap anywhere — lose a heart</p>

    <script type="module">
      const row = document.querySelector("[data-hud-hearts]");
      const hearts = [...row.querySelectorAll(".hud-hearts-row__heart")];
      let lives = hearts.length;

      // the binder games copy — six lines, vanilla
      const render = () => {
        row.dataset.value = String(lives);
        hearts.forEach((heart, i) => {
          if (i < lives) {
            heart.removeAttribute("aria-hidden");
          } else {
            heart.setAttribute("aria-hidden", "true");
          }
        });
      };
      render();

      addEventListener("pointerdown", () => {
        lives = lives > 0 ? lives - 1 : hearts.length;
        render();
      });
    </script>
  </body>
</html>
