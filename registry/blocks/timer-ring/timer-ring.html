<!doctype html>
<!-- frogoe block source: hud-timer-ring — this file IS viewable in a browser (default
     state on a neutral backdrop). Copy ONLY between the markers into your
     game's hud/ layer; the interactive playground is demo.html. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>frogoe block — hud-timer-ring</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 50% 0%, #182031 0%, #0d1220 60%, #080b13 100%);
      }
    </style>
  </head>
  <body>
    <!-- ===================== COPY FROM HERE ===================== -->
    <!--
  frogoe block: timer-ring
  Circular countdown ring (fuel/time/boost as a dial instead of a bar).
  Ring drains smoothly; data-low switches to danger and pulses — semantic
  urgency, never guessed from hue alone.

  Bind from game.js (vanilla, no helper):
    const ring = document.querySelector("[data-block-timer]");
    ring.style.setProperty("--block-left", String(fraction));   // 0..1 remaining
    ring.toggleAttribute("data-low", fraction < 0.25);
    ring.querySelector("[data-block-timer-label]").textContent = secs;

  Theme: --block-accent (ring), --block-danger, --block-fg, --block-outline, --block-track.
-->
    <style>
      .block-timer-ring {
        --block-accent: #ffd166;
        --block-danger: #ff5d5d;
        --block-fg: #fffdf7;
        --block-font: "Fredoka", "Baloo 2", system-ui, sans-serif;
        --block-left: 1;
        --block-outline: #26180a;
        --block-ring-color: var(--block-accent);
        --block-size: clamp(3.4rem, 13vmin, 4.6rem);
        --block-track: rgba(10, 14, 26, 0.5);

        position: relative;
        width: var(--block-size);
        height: var(--block-size);
        color: var(--block-fg);
        font-family: var(--block-font);
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .block-timer-ring svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg); /* dial starts at 12 o'clock */
      }
      .block-timer-ring__track {
        fill: var(--block-track);
        stroke: rgba(255, 255, 255, 0.14);
        stroke-width: 6;
      }
      .block-timer-ring__arc {
        fill: none;
        stroke: var(--block-ring-color);
        stroke-width: 6;
        stroke-linecap: round;
        /* dash math: circumference 100 — --block-left is the remaining fraction */
        stroke-dasharray: 100;
        stroke-dashoffset: calc(100 - (100 * var(--block-left)));
        transition:
          stroke-dashoffset 240ms ease-out,
          stroke 160ms ease;
        filter: drop-shadow(0 2px 0 var(--block-outline));
      }
      .block-timer-ring__label {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: calc(var(--block-size) * 0.3);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 2px 0 var(--block-outline);
      }
      .block-timer-ring[data-low] {
        --block-ring-color: var(--block-danger);
      }
      .block-timer-ring[data-low] .block-timer-ring__label {
        animation: hud-ring-low 640ms ease-in-out infinite alternate;
      }
      @keyframes hud-ring-low {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .block-timer-ring__arc {
          transition: none;
        }
        .block-timer-ring[data-low] .block-timer-ring__label {
          animation: none;
        }
      }
    </style>

    <div class="block-timer-ring" data-block-timer>
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle class="block-timer-ring__track" cx="20" cy="20" r="16"></circle>
        <circle class="block-timer-ring__arc" cx="20" cy="20" r="16"></circle>
      </svg>
      <span class="block-timer-ring__label" data-block-timer-label>45</span>
    </div>
    <!-- ===================== COPY TO HERE ======================= -->
  </body>
</html>
